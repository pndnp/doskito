services:
  server:
    build:
      target: development
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./server/src:/app/src
      - ./server/prisma:/app/prisma
      - ./server/package.json:/app/package.json
      - ./server/.prettierrc.json:/app/.prettierrc.json
      - ./server/eslint.config.js:/app/eslint.config.js
      - ./server/tsconfig.json:/app/tsconfig.json
      - ./server/tsconfig.build.json:/app/tsconfig.build.json
      - ./server/prisma.config.ts:/app/prisma.config.ts
      - server_node_modules:/app/node_modules

  client:
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./client/src:/app/src
      - ./client/index.html:/app/index.html
      - ./client/.prettierrc.json:/app/.prettierrc.json
      - ./client/.prettierignore:/app/.prettierignore
      - ./client/eslint.config.js:/app/eslint.config.js
      - ./client/stylelint.config.js:/app/stylelint.config.js
      - ./client/vite.config.ts:/app/vite.config.ts
      - ./client/tsconfig.json:/app/tsconfig.json
      - ./client/tsconfig.app.json:/app/tsconfig.app.json
      - ./client/tsconfig.node.json:/app/tsconfig.node.json
      - ./design:/design:ro
      - client_node_modules:/app/node_modules

  web:
    profiles: ["production"]

volumes:
  server_node_modules:
  client_node_modules:
