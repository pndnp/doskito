x-server-env: &server-env
  DATABASE_URL: file:/app/data/doskito.db
  NEURALDEEP_API_URL: ${NEURALDEEP_API_URL:-}
  NEURALDEEP_API_KEY: ${NEURALDEEP_API_KEY:-}
  NEURALDEEP_MODEL: ${NEURALDEEP_MODEL:-}
  ADMIN_SECRET: ${ADMIN_SECRET:-}
  CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
  PORT: 3001
  RUN_MIGRATIONS: "true"

services:
  server:
    build:
      context: ./server
      target: production
    environment: *server-env
    volumes:
      - ./data:/app/data
    init: true
    stop_grace_period: 20s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      target: development
    depends_on:
      server:
        condition: service_healthy
    environment:
      VITE_PROXY_TARGET: http://server:3001
      VITE_API_URL: ""
      DESIGN_PATH: /design
    stop_grace_period: 10s
    user: node
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
      target: production
      args:
        VITE_API_URL: ""
    depends_on:
      server:
        condition: service_healthy
    stop_grace_period: 10s
    restart: unless-stopped
